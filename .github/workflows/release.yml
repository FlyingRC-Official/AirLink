name: release-v0.3.1-dev

on:
  push:
    tags: [v0.3.1-dev]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v7
      - name: Build release firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32c5
          idf.py -B build-release -D SDKCONFIG=build-release/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.release" build
          # The browser flasher downloads the immutable files from this tag and
          # compares them with GitHub Release digests. Compile above as a source
          # verification, but package the exact bench-qualified bytes committed
          # before tagging so build timestamps cannot change their SHA-256.
          locked=tools/usb_flasher/public/firmware/v0.3.1-dev
          mkdir -p build-locked/bootloader build-locked/partition_table
          cp "$locked/airlink.bin" build-locked/airlink.bin
          cp "$locked/bootloader.bin" build-locked/bootloader/bootloader.bin
          cp "$locked/partition-table.bin" build-locked/partition_table/partition-table.bin
          cp "$locked/ota_data_initial.bin" build-locked/ota_data_initial.bin
          cp build-release/flash_args build-locked/flash_args
          package=$(tools/create_release.sh build-locked 0.3.1-dev)
          cp "$locked/manifest.json" "$package/manifest.json"
          python3 - "$package" <<'PY'
          import hashlib, json, pathlib, sys
          package = pathlib.Path(sys.argv[1])
          manifest = json.loads((package / "manifest.json").read_text())
          for name, expected in manifest["images"].items():
              actual = hashlib.sha256((package / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"locked release hash mismatch: {name}: {actual} != {expected}")
          PY
          cd "$package"
          zip -qr "../AirLink-Firmware-v0.3.1-dev.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            dist/AirLink-Firmware-v0.3.1-dev.zip
            dist/airlink-0.3.1-dev/*

  web-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/usb_flasher/package-lock.json
      - name: Build flasher and configurator
        run: |
          cd tools/usb_flasher
          npm ci
          npm run build
          npm test
          mkdir -p ../../dist/AirLink-USB-Flasher-v0.3.1-dev
          cp www/AirLink-Flasher-v0.3.1-dev.html README.md THIRD_PARTY_NOTICES.md start_flasher.bat start_flasher.command ../../dist/AirLink-USB-Flasher-v0.3.1-dev/
          cd ../../dist
          zip -qr AirLink-USB-Flasher-v0.3.1-dev.zip AirLink-USB-Flasher-v0.3.1-dev
          cp AirLink-USB-Flasher-v0.3.1-dev/AirLink-Flasher-v0.3.1-dev.html .
          cd ../tools/configurator
          npm run build
          npm test
          cp AirLink-Configurator.html ../../dist/AirLink-Configurator-v0.3.1-dev.html
      - uses: actions/upload-artifact@v4
        with:
          name: release-web-tools
          path: |
            dist/AirLink-Flasher-v0.3.1-dev.html
            dist/AirLink-USB-Flasher-v0.3.1-dev.zip
            dist/AirLink-Configurator-v0.3.1-dev.html

  helper:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AirLink-Configurator-Helper-Windows-x64-v0.3.1-dev.zip
          - os: macos-latest
            artifact: AirLink-Configurator-Helper-macOS-Universal-v0.3.1-dev.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/configurator/helper/go.mod
      - name: Build embedded page
        working-directory: tools/configurator
        run: npm run build
      - name: Test helper
        working-directory: tools/configurator/helper
        run: go test ./...
      - name: Package Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: tools/configurator
        run: |
          go build -C helper -trimpath -o ../AirLink-Configurator-Helper.exe .
          New-Item -ItemType Directory bundle | Out-Null
          Copy-Item AirLink-Configurator-Helper.exe,AirLink-Configurator.html,start_configurator.bat,README.md bundle/
          Compress-Archive bundle/* ../../AirLink-Configurator-Helper-Windows-x64-v0.3.1-dev.zip
      - name: Package macOS Universal
        if: runner.os == 'macOS'
        working-directory: tools/configurator
        run: |
          GOOS=darwin GOARCH=amd64 go build -C helper -trimpath -o ../helper-amd64 .
          GOOS=darwin GOARCH=arm64 go build -C helper -trimpath -o ../helper-arm64 .
          lipo -create helper-amd64 helper-arm64 -output AirLink-Configurator-Helper
          mkdir bundle
          cp AirLink-Configurator-Helper AirLink-Configurator.html start_configurator.command README.md bundle/
          chmod +x bundle/AirLink-Configurator-Helper bundle/start_configurator.command
          ditto -c -k --sequesterRsrc --keepParent bundle ../../AirLink-Configurator-Helper-macOS-Universal-v0.3.1-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ runner.os }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [firmware, web-tools, helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release-assets -type f -maxdepth 2 -print
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create v0.3.1-dev "${assets[@]}" \
            --verify-tag --prerelease --title "AirLink V0.3.1-DEV" \
            --notes-file docs/RELEASE_NOTES_v0.3.1-dev.md
