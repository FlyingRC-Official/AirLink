name: release-v0.5.0-dev

on:
  push:
    tags: [v0.5.0-dev]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build and package release firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32c5
          idf.py -B build-release -D SDKCONFIG=build-release/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.release" build
          package=$(tools/create_release.sh build-release 0.5.0-dev)
          cd "$package"
          zip -qr "../AirLink-Firmware-v0.5.0-dev.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            dist/AirLink-Firmware-v0.5.0-dev.zip
            dist/airlink-0.5.0-dev/*

  flasher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/usb_flasher/package-lock.json
      - name: Build and test Web Serial flasher
        working-directory: tools/usb_flasher
        run: |
          npm ci
          npm run build
          npm test
      - name: Package flasher
        run: |
          mkdir -p dist/AirLink-USB-Flasher-v0.5.0-dev
          cp tools/usb_flasher/www/AirLink-Flasher-v0.5.0-dev.html tools/usb_flasher/README.md tools/usb_flasher/THIRD_PARTY_NOTICES.md tools/usb_flasher/start_flasher.bat tools/usb_flasher/start_flasher.command dist/AirLink-USB-Flasher-v0.5.0-dev/
          cd dist
          zip -qr AirLink-USB-Flasher-v0.5.0-dev.zip AirLink-USB-Flasher-v0.5.0-dev
      - uses: actions/upload-artifact@v4
        with:
          name: release-flasher
          path: dist/AirLink-USB-Flasher-v0.5.0-dev.zip

  publish:
    needs: [firmware, flasher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create v0.5.0-dev "${assets[@]}" --verify-tag --prerelease --target master --title "AirLink V0.5.0-DEV" --notes-file docs/RELEASE_NOTES_v0.5.0-dev.md
