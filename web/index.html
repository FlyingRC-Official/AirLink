<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlyingRC AirLink</title><style>
:root{color-scheme:dark;--bg:#07111d;--card:#102234;--line:#244058;--accent:#42b9ff;--bad:#ff625f}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:linear-gradient(135deg,#07111d,#102a3e);color:#eef7ff}main{max-width:980px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#102234ee;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 12px 30px #0004}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:grid;gap:5px;color:#aac3d6}input,select,button{font:inherit;color:#fff;background:#091827;border:1px solid #35526a;border-radius:8px;padding:10px}button{cursor:pointer;background:#156ba0}button.danger{background:#8b2929}.metric{font-size:1.25rem;color:#7bd0ff}.muted{color:#8daabd}.hidden{display:none}pre{white-space:pre-wrap;overflow:auto}#notice{min-height:1.4em;color:#ffd66b}@media(max-width:600px){main{padding:12px}.top{align-items:flex-start}}
</style></head><body><main><div class="top"><div><h1>AirLink C5 Mesh V1</h1><div class="muted" data-i18n="subtitle">Flight telemetry gateway</div></div><button id="lang">中文</button></div>
<section class="card" id="login"><h2 data-i18n="login">Login</h2><div class="grid"><label>Username<input id="user" value="admin"></label><label>Password<input id="pass" type="password"></label></div><p><button onclick="connect()" data-i18n="connect">Connect</button></p></section>
<div id="app" class="hidden"><section class="card"><h2 data-i18n="status">Status</h2><div class="grid" id="metrics"></div><pre id="notice"></pre></section>
<section class="card"><h2 data-i18n="settings">Settings</h2><div class="grid">
<label data-i18n="route">Route mode<select id="route_mode"><option value="0">MAVLink</option><option value="1">Transparent</option></select></label>
<label>Bridge role<select id="bridge_role"><option value="0">Off / gateway</option><option value="1">Air / UART + AP</option><option value="2">Ground / STA + USB</option></select></label>
<label>UART baud<select id="uart_baud"><option>57600</option><option>115200</option><option>230400</option><option>460800</option><option>921600</option></select></label>
<label>Wi-Fi mode<select id="wifi_mode"><option value="0">AP</option><option value="1">STA</option><option value="2">AP+STA</option></select></label>
<label data-i18n="band">Band<select id="wifi_band"><option value="0">Auto</option><option value="1">2.4 GHz</option><option value="2">5 GHz</option></select></label>
<label>AP SSID<input id="ap_ssid"></label><label data-i18n="new_ap_password">New AP password<input id="ap_password" type="password" placeholder="unchanged"></label>
<label>STA SSID<input id="sta_ssid"></label><label data-i18n="new_sta_password">New STA password<input id="sta_password" type="password" placeholder="unchanged"></label>
<label>UDP port<input id="udp_port" type="number"></label><label>TCP port<input id="tcp_port" type="number"></label>
<label>USB<select id="usb_mode"><option value="0">LOG_CLI</option><option value="1">MAVLink</option></select></label>
<label>CAN<select id="can_bitrate"><option value="125000">125 kbit/s</option><option value="250000">250 kbit/s</option><option value="500000">500 kbit/s</option><option value="1000000">1 Mbit/s</option></select></label>
<label data-i18n="brightness">LED brightness<input id="led_brightness" type="range" min="0" max="100"></label></div>
<p class="muted" data-i18n="bandnote">AP+STA shares one channel; ESP32-C5 is not simultaneous dual-band.</p><button onclick="save()" data-i18n="save">Save (reboot required)</button></section>
<section class="card"><h2>CAN / DroneCAN</h2><pre id="can"></pre></section>
<section class="card"><h2>OTA</h2><input id="firmware" type="file" accept=".bin"><button onclick="ota()" data-i18n="upload">Upload firmware</button><p class="muted" data-i18n="otawarn">SHA-256 integrity only; this development release does not authenticate the publisher.</p></section>
<section class="card"><button onclick="action('reboot')" data-i18n="reboot">Reboot</button> <button class="danger" onclick="action('factory-reset')" data-i18n="reset">Factory reset</button></section></div></main><script>
const T={en:{subtitle:'Flight telemetry gateway',login:'Login',connect:'Connect',status:'Status',settings:'Settings',route:'Route mode',band:'Band',new_ap_password:'New AP password',new_sta_password:'New STA password',brightness:'LED brightness',bandnote:'AP+STA shares one channel; ESP32-C5 is not simultaneous dual-band.',save:'Save (reboot required)',upload:'Upload firmware',otawarn:'SHA-256 integrity only; this development release does not authenticate the publisher.',reboot:'Reboot',reset:'Factory reset'},zh:{subtitle:'飞控遥测网关',login:'登录',connect:'连接',status:'状态',settings:'设置',route:'路由模式',band:'频段',new_ap_password:'新AP密码',new_sta_password:'新STA密码',brightness:'LED亮度',bandnote:'AP+STA共用一个信道；ESP32-C5不能同时双频工作。',save:'保存（需要重启）',upload:'上传固件',otawarn:'开发版仅校验SHA-256完整性，不验证发布者身份。',reboot:'重启',reset:'恢复出厂'}};let language='en',auth='';
function tr(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T[language][e.dataset.i18n]);document.querySelector('#lang').textContent=language==='en'?'中文':'EN'}document.querySelector('#lang').onclick=()=>{language=language==='en'?'zh':'en';tr()};
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:auth};let r=await fetch(path,opt);let j=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw Error(j.error||r.statusText);return j}
async function connect(){auth='Basic '+btoa(user.value+':'+pass.value);try{await refresh();login.classList.add('hidden');app.classList.remove('hidden');setInterval(refresh,2000)}catch(e){notice.textContent=e}}
async function refresh(){let [s,c,cn]=await Promise.all([api('/api/v1/status'),api('/api/v1/config'),api('/api/v1/can')]);metrics.innerHTML=[['Firmware',s.firmware],['FC',s.fc_armed?'ARMED':s.fc_seen?'Connected':'No data'],['Wi-Fi',`${s.wifi.rssi} dBm / ch ${s.wifi.channel}`],['Bridge',s.wifi.bridge_connected?'Connected':'Idle'],['Clients',`${s.wifi.udp_clients} UDP / ${s.wifi.tcp_clients} TCP`],['Heap',s.free_heap],['Uptime',s.uptime_s+' s']].map(x=>`<div><span class="muted">${x[0]}</span><div class="metric">${x[1]}</div></div>`).join('');can.textContent=JSON.stringify(cn,null,2);if(!window.loaded){Object.keys(c).forEach(k=>{let e=document.getElementById(k);if(e)e.value=c[k]});window.loaded=true}}
async function save(){let keys=['route_mode','bridge_role','uart_baud','wifi_mode','wifi_band','ap_ssid','ap_password','sta_ssid','sta_password','udp_port','tcp_port','usb_mode','can_bitrate','led_brightness'],o={};keys.forEach(k=>{let v=document.getElementById(k).value;if((k.endsWith('password'))&&!v)return;o[k]=['ap_ssid','sta_ssid','ap_password','sta_password'].includes(k)?v:Number(v)});if(o.bridge_role===1){o.wifi_mode=0;o.usb_mode=0}else if(o.bridge_role===2){o.wifi_mode=1;o.usb_mode=1}try{notice.textContent=JSON.stringify(await api('/api/v1/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}))}catch(e){notice.textContent=e}}
async function action(name){if(!confirm(name+'?'))return;try{notice.textContent=JSON.stringify(await api('/api/v1/actions/'+name,{method:'POST'}))}catch(e){notice.textContent=e}}
async function ota(){let f=firmware.files[0];if(!f)return;let b=await f.arrayBuffer(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');try{notice.textContent=JSON.stringify(await api('/api/v1/ota',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-AirLink-Hardware':'airlink-c5-mesh-v1','X-AirLink-Flash-Bytes':'8388608','X-AirLink-PSRAM-Bytes':'8388608','X-AirLink-SHA256':hash},body:b}))}catch(e){notice.textContent=e}}
tr();</script></body></html>
